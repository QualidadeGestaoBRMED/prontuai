services:
  - type: web
    name: prontuai-backend
    runtime: python
    env: python
    region: oregon
    plan: free
    branch: v1
    rootDir: back-end
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: BRMED_USERNAME
        sync: false
      - key: BRMED_PASSWORD
        sync: false
      - key: USE_TEXTRACT
        value: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: 24
