apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      # Extrai o trace_id da linha JSON e o mostra como campo destacado no
      # detalhe do log. A correlação de logs do backend
      # (OTEL_PYTHON_LOG_CORRELATION) é quem coloca esse campo lá.
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":\s*"(\w+)"'
          # Sem datasourceUid o campo aparece destacado mas não vira link. Para
          # transformá-lo em "pular para o trace", acrescente um datasource de
          # traces (Tempo/Jaeger) à stack e então:
          #   datasourceUid: tempo
          #   url: '${__value.raw}'
          # Nesse dia, ligue também OTEL_TRACES_EXPORTER=otlp no .env do backend
          # e aponte o exporter de traces do otel-collector para o Tempo — hoje
          # elas são descartadas no exporter "debug".
