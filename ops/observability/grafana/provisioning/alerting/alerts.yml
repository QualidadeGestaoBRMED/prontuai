apiVersion: 1

groups:
  - orgId: 1
    name: prontuai-alerts
    folder: ProntuAI
    interval: 1m
    rules:
      - uid: prontuai-errors
        title: Backend errors detected
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: loki
                uid: loki
              expr: "sum(rate({job=\"prontuai-backend\", level=\"ERROR\"}[5m]))"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 2m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "Errors detected in backend logs"
          description: "Check Loki logs for error details."
        labels:
          severity: warning
