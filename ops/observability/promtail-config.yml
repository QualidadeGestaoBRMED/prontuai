server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: prontuai-backend
    static_configs:
      - targets: ["localhost"]
        labels:
          job: prontuai-backend
          __path__: /var/log/prontuai/app.log
    # IMPORTANTE: só campos de BAIXA cardinalidade viram labels (cada combinação
    # de labels cria um stream no Loki; request_id/user_email/cpf como label
    # estouram o limite de streams ativos e a ingestão para com 429).
    # Os demais campos ficam no corpo JSON da linha e são filtráveis em tempo
    # de consulta com `| json | campo=~"..."`.
    #
    # trace_id/span_id (injetados pela correlação de logs do OTel) ficam
    # DELIBERADAMENTE fora dos labels: são de cardinalidade altíssima — um
    # stream novo por requisição — e continuam clicáveis via derived field do
    # datasource Loki (ver grafana/provisioning/datasources/loki.yml).
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          logger:
