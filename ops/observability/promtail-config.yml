server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: prontuai-backend
    static_configs:
      - targets: ["localhost"]
        labels:
          job: prontuai-backend
          __path__: /var/log/prontuai/app.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            request_id: request_id
            user_email: user_email
            user_role: user_role
            clinic_id: clinic_id
            action: action
            resource: resource
            resource_id: resource_id
            document_id: document_id
            cpf: cpf
            filename: filename
            path: path
            method: method
            status_code: status_code
            duration_ms: duration_ms
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          request_id:
          level:
          logger:
          user_email:
          user_role:
          clinic_id:
          action:
          resource:
          resource_id:
          document_id:
          cpf:
          filename:
          path:
          method:
          status_code:
      - output:
          source: message
