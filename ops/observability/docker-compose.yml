# Agente de observabilidade da EC2 (a maquina do backend).
#
# A stack completa (Grafana + Loki + Prometheus + promtail) NAO roda mais aqui:
# ela vive na VPS Oracle, junto do dashboard e do otel-collector. O que sobra
# nesta maquina sao as fontes de metrica que o app nao produz e um agente que
# as empurra por OTLP para lá.
#
# Variaveis (crie um .env nesta pasta):
#   OTEL_GATEWAY_ENDPOINT   host:porta do otel-collector da Oracle (ex.: obs.exemplo.com:4317)
#   OTEL_AUTH_TOKEN         mesmo token configurado no coletor da Oracle
#   OBS_BIND_ADDRESS        bind das portas de debug (padrao 127.0.0.1; nunca exponha)
#   DB_DOCKER_NETWORK       rede do docker-compose.db.yml (padrao prontuai-db-net)
#
# Requer back-end/docker-compose.db.yml no ar (a rede externa "prontuai-db-net"
# precisa existir), porque é por ela que o agente alcanca o exporter do Postgres.

services:
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # A imagem roda como uid 10001, e um volume nomeado nasce root:root — o
    # agente morria no boot com "permission denied" ao criar a fila em disco
    # (medido: container em estado exited, nenhuma metrica saindo). Docker nao
    # tem como fazer chown de volume declarativamente, entao o agente roda como
    # root para poder escrever a fila. Nao é o ideal, mas nesta pasta ja existe
    # um cAdvisor privileged: o agente nao é o elo mais fraco.
    user: "0:0"
    environment:
      OTEL_GATEWAY_ENDPOINT: "${OTEL_GATEWAY_ENDPOINT:?OTEL_GATEWAY_ENDPOINT is required}"
      OTEL_AUTH_TOKEN: "${OTEL_AUTH_TOKEN:?OTEL_AUTH_TOKEN is required}"
    volumes:
      - ./otel-agent.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Fila em disco: sobrevive a queda do link com a Oracle e a restart.
      - otel-agent-queue:/var/lib/otelcol
    mem_limit: 256m
    restart: unless-stopped
    extra_hosts:
      # Para alcancar o node_exporter, que roda em network_mode: host.
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - db

  # Metricas da maquina (CPU, RAM, disco). Continua aqui porque é a fonte —
  # quem a exporta para fora é o agente acima.
  node_exporter:
    image: prom/node-exporter:v1.8.1
    command:
      - --path.rootfs=/host
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  # Metricas por container (memoria/CPU do backend, OCR etc).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    # Necessario no cgroup v2 para enxergar os cgroups dos demais containers
    cgroup: host
    # LIMITACAO: se o Docker do host usar containerd-snapshotter
    # (docker info -> "io.containerd.snapshotter.v1"), o cAdvisor nao consegue
    # criar os handlers dos containers e o painel "Memoria por container" fica
    # sem dados. O Docker padrao da EC2 (overlay2) funciona normalmente.
    command:
      - --docker_only=true
    ports:
      - "${OBS_BIND_ADDRESS:-127.0.0.1}:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped

volumes:
  otel-agent-queue:

networks:
  default: {}
  # Rede do docker-compose.db.yml (Postgres), para o agente alcancar o
  # /metrics do prontuai-db-exporter. Nome fixo, raramente precisa de override.
  db:
    external: true
    name: ${DB_DOCKER_NETWORK:-prontuai-db-net}
