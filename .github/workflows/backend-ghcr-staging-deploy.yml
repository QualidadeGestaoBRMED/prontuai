name: Backend GHCR Staging Deploy

on:
  push:
    branches:
      - staging
    paths:
      - "back-end/**"
      - ".github/workflows/backend-ghcr-staging-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: ${{ vars.AWS_STAGING_VPS_DEPLOY_PATH || '/home/ec2-user/prontuai-staging' }}

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prontuai
          POSTGRES_PASSWORD: prontuai
          POSTGRES_DB: prontuai_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U prontuai -d prontuai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back-end/requirements.txt

      - name: Install backend dependencies
        run: pip install -r back-end/requirements.txt

      - name: Run backend security tests
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
        run: PYTHONPATH=back-end pytest back-end/tests/test_auth_security.py -q --noconftest

      - name: Run focused backend tests
        env:
          APP_ENV: test
          DEV_AUTH_BYPASS: "true"
          OPENAI_API_KEY: test-key
          DATABASE_URL: postgresql://prontuai:prontuai@127.0.0.1:55432/prontuai_test
          USE_PRONTUAI_PATIENTS_EXAMS: "true"
        run: pytest back-end/tests/test_brmed.py -q

  build-and-push-deploy:
    name: Build, push and deploy staging
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image name
        id: image
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/prontuai-backend-stg" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: back-end
          file: back-end/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.name }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate deployment secrets
        env:
          AWS_VPS_HOST: ${{ secrets.AWS_STAGING_VPS_HOST }}
          AWS_VPS_USER: ${{ secrets.AWS_STAGING_VPS_USER }}
          AWS_VPS_SSH_KEY: ${{ secrets.AWS_STAGING_VPS_SSH_KEY }}
          AWS_VPS_PORT: ${{ vars.AWS_STAGING_VPS_PORT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Deploy context:"
          echo "- repository: $GITHUB_REPOSITORY"
          echo "- actor: $GITHUB_ACTOR"
          echo "- event: $GITHUB_EVENT_NAME"
          echo "- ref: $GITHUB_REF"

          missing=0

          if [ -z "$AWS_VPS_HOST" ]; then
            echo "Missing secret AWS_STAGING_VPS_HOST" >&2
            missing=1
          else
            echo "AWS_STAGING_VPS_HOST: present"
          fi

          if [ -z "$AWS_VPS_USER" ]; then
            echo "Missing secret AWS_STAGING_VPS_USER" >&2
            missing=1
          else
            echo "AWS_STAGING_VPS_USER: present"
          fi

          if [ -z "$AWS_VPS_SSH_KEY" ]; then
            echo "Missing secret AWS_STAGING_VPS_SSH_KEY" >&2
            missing=1
          else
            echo "AWS_STAGING_VPS_SSH_KEY: present"
          fi

          if [ -n "${AWS_VPS_PORT:-}" ]; then
            echo "AWS_STAGING_VPS_PORT: present"
          else
            echo "AWS_STAGING_VPS_PORT: not set, defaulting to 22"
          fi

          if [ "$missing" -ne 0 ]; then
            echo "One or more required staging deploy secrets are unavailable to this run." >&2
            exit 1
          fi

      - name: Prepare SSH key
        env:
          AWS_VPS_SSH_KEY: ${{ secrets.AWS_STAGING_VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AWS_VPS_SSH_KEY" > ~/.ssh/aws_vps_key
          chmod 600 ~/.ssh/aws_vps_key

      - name: Upload compose file to VPS
        env:
          AWS_VPS_HOST: ${{ secrets.AWS_STAGING_VPS_HOST }}
          AWS_VPS_USER: ${{ secrets.AWS_STAGING_VPS_USER }}
          AWS_VPS_PORT: ${{ vars.AWS_STAGING_VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/aws_vps_key -p "$AWS_VPS_PORT" -o StrictHostKeyChecking=accept-new \
            "$AWS_VPS_USER@$AWS_VPS_HOST" \
            "mkdir -p '$DEPLOY_PATH' '$DEPLOY_PATH/logs' '$DEPLOY_PATH/resultados' '$DEPLOY_PATH/ocr_resultados' '$DEPLOY_PATH/auditoria_validacao' '$DEPLOY_PATH/data/uploads'"

          scp -i ~/.ssh/aws_vps_key -P "$AWS_VPS_PORT" -o StrictHostKeyChecking=accept-new \
            back-end/docker-compose.aws.yml \
            "$AWS_VPS_USER@$AWS_VPS_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy on VPS
        env:
          AWS_VPS_HOST: ${{ secrets.AWS_STAGING_VPS_HOST }}
          AWS_VPS_USER: ${{ secrets.AWS_STAGING_VPS_USER }}
          AWS_VPS_PORT: ${{ vars.AWS_STAGING_VPS_PORT || '22' }}
          GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_STAGING_DEPLOY_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_STAGING_DEPLOY_TOKEN }}
          BACKEND_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
        run: |
          ssh -i ~/.ssh/aws_vps_key -p "$AWS_VPS_PORT" -o StrictHostKeyChecking=accept-new \
            "$AWS_VPS_USER@$AWS_VPS_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' BACKEND_IMAGE='$BACKEND_IMAGE' GHCR_DEPLOY_USERNAME='$GHCR_DEPLOY_USERNAME' GHCR_DEPLOY_TOKEN='$GHCR_DEPLOY_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          if [ ! -f .env ]; then
            echo "Missing $DEPLOY_PATH/.env on VPS. Create it from back-end/.env.example before deploying." >&2
            exit 1
          fi

          target_backend_image="$BACKEND_IMAGE"
          set -a
          . ./.env
          set +a
          BACKEND_IMAGE="$target_backend_image"

          if [ -n "${GHCR_DEPLOY_USERNAME:-}" ] && [ -n "${GHCR_DEPLOY_TOKEN:-}" ]; then
            printf '%s\n' "$GHCR_DEPLOY_TOKEN" | docker login ghcr.io -u "$GHCR_DEPLOY_USERNAME" --password-stdin
          fi

          export BACKEND_IMAGE
          docker compose -f docker-compose.yml pull prontuai-backend-stg
          docker compose -f docker-compose.yml up -d --remove-orphans prontuai-backend-stg

          health_port="${BACKEND_HTTP_PORT:-8080}"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${health_port}/health" >/dev/null; then
              printf '%s\n' "$BACKEND_IMAGE" > .current_backend_image
              docker image prune -f >/dev/null 2>&1 || true
              echo "Staging deploy OK: $BACKEND_IMAGE"
              exit 0
            fi
            sleep 2
          done

          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail=80 prontuai-backend-stg
          echo "Staging health check failed after deploy." >&2
          exit 1
          REMOTE
