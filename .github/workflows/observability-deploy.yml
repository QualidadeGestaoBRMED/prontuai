name: Observability Deploy

on:
  push:
    branches:
      - v1
    paths:
      - "ops/observability/**"
      - ".github/workflows/observability-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  OBS_DEPLOY_PATH: ${{ vars.AWS_VPS_OBS_DEPLOY_PATH || '/home/ec2-user/prontuai-observability' }}

jobs:
  deploy:
    name: Sync and reload observability stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare SSH key
        env:
          AWS_VPS_SSH_KEY: ${{ secrets.AWS_VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AWS_VPS_SSH_KEY" > ~/.ssh/aws_vps_key
          chmod 600 ~/.ssh/aws_vps_key

      - name: Upload observability files to VPS
        env:
          AWS_VPS_HOST: ${{ secrets.AWS_VPS_HOST }}
          AWS_VPS_USER: ${{ secrets.AWS_VPS_USER }}
          AWS_VPS_PORT: ${{ vars.AWS_VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/aws_vps_key -p "$AWS_VPS_PORT" -o StrictHostKeyChecking=accept-new \
            "$AWS_VPS_USER@$AWS_VPS_HOST" \
            "mkdir -p '$OBS_DEPLOY_PATH/promtail-positions'"

          # Remove configs antigos antes de extrair para não deixar dashboards
          # deletados no repo sobrando no servidor. Preserva .env, positions e volumes.
          ssh -i ~/.ssh/aws_vps_key -p "$AWS_VPS_PORT" -o StrictHostKeyChecking=accept-new \
            "$AWS_VPS_USER@$AWS_VPS_HOST" \
            "cd '$OBS_DEPLOY_PATH' && rm -rf grafana docker-compose.yml loki-config.yml prometheus.yml promtail-config.yml otel-collector.yml README.md backend-env.example"

          tar -C ops/observability --exclude='promtail-positions' -czf - . |
            ssh -i ~/.ssh/aws_vps_key -p "$AWS_VPS_PORT" -o StrictHostKeyChecking=accept-new \
              "$AWS_VPS_USER@$AWS_VPS_HOST" \
              "tar -C '$OBS_DEPLOY_PATH' -xzf -"

      - name: Reload stack on VPS
        env:
          AWS_VPS_HOST: ${{ secrets.AWS_VPS_HOST }}
          AWS_VPS_USER: ${{ secrets.AWS_VPS_USER }}
          AWS_VPS_PORT: ${{ vars.AWS_VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/aws_vps_key -p "$AWS_VPS_PORT" -o StrictHostKeyChecking=accept-new \
            "$AWS_VPS_USER@$AWS_VPS_HOST" \
            "OBS_DEPLOY_PATH='$OBS_DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$OBS_DEPLOY_PATH"

          if [ ! -f .env ]; then
            echo "Missing $OBS_DEPLOY_PATH/.env on VPS." >&2
            echo "Create it once with BACKEND_LOGS_PATH, BACKEND_DOCKER_NETWORK and GRAFANA_ADMIN_PASSWORD (see ops/observability/README.md)." >&2
            exit 1
          fi

          docker compose pull -q
          docker compose up -d --remove-orphans
          # Configs montadas como arquivo (loki/promtail/prometheus) e
          # alertas/datasources provisionados só são relidos na inicialização —
          # `up -d` não recria container quando só o conteúdo do volume mudou.
          docker compose restart loki promtail prometheus grafana otel-collector

          docker compose ps
          echo "Observability deploy OK"
          REMOTE
