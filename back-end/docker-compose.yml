services:
  prontuai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prontuai-backend
    restart: unless-stopped
    env_file: .env
    ports:
      # Evita exposição pública por padrão; mantém acesso local para debug.
      - "127.0.0.1:${BACKEND_HTTP_PORT:-8080}:80"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BRMED_USERNAME=${BRMED_USERNAME}
      - BRMED_PASSWORD=${BRMED_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - USE_TEXTRACT=${USE_TEXTRACT:-false}
      - MODELO_GPT=${MODELO_GPT:-gpt-4o-mini}
      - MODELO_EMBEDDING=${MODELO_EMBEDDING:-text-embedding-3-large}
      - K_VIZINHOS_FAQ=${K_VIZINHOS_FAQ:-2}
      - MAX_DISTANCIA_FAQ=${MAX_DISTANCIA_FAQ:-1.0}
      # JobManager está em memória; múltiplos workers causam 404 em /v1/jobs
      - WORKERS=${WORKERS:-1}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Rate limit compartilhado (contadores sobrevivem a restart e valem
      # para todas as instâncias)
      - REDIS_URL=${REDIS_URL:-redis://prontuai-redis:6379/0}
      # Headers X-Forwarded-For/X-Real-IP só são aceitos vindos destas origens
      # (nginx no host chega ao container pelo gateway da rede do Docker)
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.16.0.0/12}
    depends_on:
      - prontuai-redis
    volumes:
      # Persistir logs e resultados
      - ./logs:/app/logs
      - ./resultados:/app/resultados
      - ./ocr_resultados:/app/ocr_resultados
      - ./auditoria_validacao:/app/auditoria_validacao
      # Uploads para visualização (leitura/escrita)
      - ./data/uploads:/app/data/uploads
      # Dados FAISS (apenas leitura)
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prontuai-redis:
    image: redis:7-alpine
    container_name: prontuai-redis
    restart: unless-stopped
    # Sem porta publicada: acessível apenas pela rede interna do Docker.
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
