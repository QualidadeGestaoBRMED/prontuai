services:
  prontuai-backend-stg:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: prontuai-backend-stg
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HTTP_PORT:-8080}:80"
    environment:
      # JobManager está em memória; múltiplos workers causam 404 em /v1/jobs.
      - WORKERS=${WORKERS:-1}
      # Rate limit compartilhado entre instâncias
      - REDIS_URL=${REDIS_URL:-redis://prontuai-redis-stg:6379/0}
      # Limites por minuto (auth conta por IP; os demais por usuário logado).
      - RATE_LIMIT_AUTH_PER_MINUTE=${RATE_LIMIT_AUTH_PER_MINUTE:-120}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-300}
      - RATE_LIMIT_JOBS_PER_MINUTE=${RATE_LIMIT_JOBS_PER_MINUTE:-600}
      - RATE_LIMIT_NOTIFICATIONS_PER_MINUTE=${RATE_LIMIT_NOTIFICATIONS_PER_MINUTE:-240}
      - RATE_LIMIT_UPLOAD_TOKEN_PER_MINUTE=${RATE_LIMIT_UPLOAD_TOKEN_PER_MINUTE:-240}
      # Headers de proxy só são aceitos vindos destas origens
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.16.0.0/12}
    depends_on:
      - prontuai-redis-stg
      - prontuai-db-stg
    volumes:
      - ./logs:/app/logs
      - ./resultados:/app/resultados
      - ./ocr_resultados:/app/ocr_resultados
      - ./auditoria_validacao:/app/auditoria_validacao
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Postgres proprio do staging. Fica neste compose (e nao separado como o
  # prontuai-db de producao) para que o `up -d prontuai-backend-stg` do deploy
  # o suba junto via depends_on. Mesmo compose = mesma rede default, entao o
  # backend resolve o host "prontuai-db-stg" pelo nome do servico.
  prontuai-db-stg:
    image: postgres:17-alpine
    container_name: prontuai-db-stg
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-prontuai}
    # Sem porta publicada: o banco de staging so e acessivel pela rede interna.
    # Para inspecionar do host: docker exec -it prontuai-db-stg psql -U prontuai
    volumes:
      - ./pgdata-stg:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prontuai} -d ${POSTGRES_DB:-prontuai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prontuai-redis-stg:
    image: redis:7-alpine
    container_name: prontuai-redis-stg
    restart: unless-stopped
    # Sem porta publicada: acessível apenas pela rede interna do Docker.
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
