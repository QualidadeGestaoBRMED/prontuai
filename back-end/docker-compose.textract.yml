version: '3.8'

# Docker Compose otimizado para usar APENAS Textract (sem Docling/PyTorch)
# Use este arquivo se USE_TEXTRACT=true no .env
# Build: docker-compose -f docker-compose.textract.yml up -d --build

services:
  prontuai-backend:
    build:
      context: .
      dockerfile: Dockerfile.textract
    container_name: prontuai-backend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BRMED_USERNAME=${BRMED_USERNAME}
      - BRMED_PASSWORD=${BRMED_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - USE_TEXTRACT=${USE_TEXTRACT:-true}
      - MODELO_GPT=${MODELO_GPT:-gpt-4o-mini}
      - MODELO_EMBEDDING=${MODELO_EMBEDDING:-text-embedding-3-large}
      - K_VIZINHOS_FAQ=${K_VIZINHOS_FAQ:-2}
      - MAX_DISTANCIA_FAQ=${MAX_DISTANCIA_FAQ:-1.0}
      - WORKERS=${WORKERS:-4}
    volumes:
      # Persistir logs e resultados
      - ./logs:/app/logs
      - ./resultados:/app/resultados
      - ./ocr_resultados:/app/ocr_resultados
      - ./auditoria_validacao:/app/auditoria_validacao
      # Dados FAISS (apenas leitura)
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
