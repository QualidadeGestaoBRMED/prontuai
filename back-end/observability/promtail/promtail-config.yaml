server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: prontuai-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: prontuai-backend
          __path__: /var/log/prontuai/app.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            request_id: request_id
            user_email: user_email
            user_id: user_id
            user_role: user_role
            method: method
            path: path
            status_code: status_code
            duration_ms: duration_ms
      - labels:
          level:
          logger:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
