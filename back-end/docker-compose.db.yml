services:
  prontuai-db:
    image: postgres:17-alpine
    container_name: prontuai-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-prontuai}

    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prontuai} -d ${POSTGRES_DB:-prontuai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prontuai-db-net

  prontuai-db-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.13.2
    container_name: prontuai-db-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@prontuai-db:5432/${POSTGRES_DB:-prontuai}?sslmode=disable
    depends_on:
      prontuai-db:
        condition: service_healthy
    networks:
      - prontuai-db-net
    healthcheck:
      # Nao basta o /metrics responder: se o exporter subir antes do Postgres
      # estar pronto, o PostgresCollector falha na criacao e NUNCA mais tenta —
      # as queries legadas seguem servindo 200, e pg_up fica 1. Ficou 18 dias
      # assim em ago/2026 sem nenhum sinal. Checar uma metrica do collector novo
      # torna a falha visivel (container unhealthy).
      #
      # Num reboot o Docker religa pela politica restart:, que IGNORA
      # depends_on — entao a corrida entre exporter e banco pode se repetir.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9187/metrics | grep -q '^pg_stat_database_numbackends' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  prontuai-db-net:
    name: prontuai-db-net
