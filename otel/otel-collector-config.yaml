# Coletor OTel da VPS Oracle: recebe metricas, traces e logs de vários projetos
# por OTLP autenticado e distribui para Tempo, Prometheus e Loki.
#
# É a única porta de entrada da telemetria. Os apps (em outras máquinas) só
# alcançam este coletor pela porta publicada no host, com o token certo — por
# isso a autenticação não é opcional aqui: sem ela, qualquer um que descobrisse
# o endereço mandaria telemetria se passando por outro projeto.

extensions:
  bearertokenauth:
    scheme: "Bearer"
    token: "${env:OTEL_AUTH_TOKEN}"

receivers:
  # Texto claro, de proposito: quem termina TLS agora e o nginx
  # (ops/deploy/nginx/brmed-otel-collector.duckdns.org.conf). Isso acaba com a
  # armadilha de a ingestao morrer em 90 dias por certificado renovado e nao
  # copiado para ca — passa a haver um dono so do certificado. A autenticacao
  # por token continua aqui; o nginx nao valida o Bearer.
  #
  # 0.0.0.0 e OBRIGATORIO, nao descuido. O endpoint aqui e o binding DENTRO do
  # container; com 127.0.0.1 o coletor escuta so no loopback do container, e o
  # docker-proxy — que aceita a conexao do nginx no host — encaminha para o IP
  # do container, onde ninguem escuta. O sintoma e enganoso: `ss` mostra
  # 127.0.0.1:4317 LISTEN no host (e o docker-proxy), o coletor sobe sem erro,
  # e o nginx devolve 502 com "Connection reset by peer".
  #
  # Quem restringe a exposicao e a PUBLICACAO da porta no compose
  # (127.0.0.1:4317:4317), nao este endpoint. A propriedade de seguranca e a
  # mesma: o host so escuta no loopback.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  # Primeiro da lista de proposito: começa a recusar lotes antes de o coletor
  # estourar a memoria da VPS e ser morto pelo OOM killer.
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 10s
    send_batch_size: 1024

  # Só no pipeline de logs. O exporter do Loki promove service.instance.id ao
  # label "instance", e o nosso vale <host>-<pid>: cada deploy (e cada worker do
  # gunicorn) viraria um stream novo, que é exatamente o que estoura o Loki.
  # As metricas continuam com o instance, onde ele é necessario para os workers
  # nao colidirem numa serie só.
  resource/logs:
    attributes:
      - key: service.instance.id
        action: delete

  # Rede de seguranca de PII, NAO a defesa principal. A aplicacao mascara antes
  # de logar (app/core/pii.py); isto existe para o que passar batido, porque um
  # `logger.info` novo com CPF e mais facil de escrever do que de revisar — e
  # aqui os logs saem do perimetro de producao para uma VPS compartilhada entre
  # projetos, o que muda a consequencia de um vazamento.
  #
  # Cobre corpo da linha e o atributo de mensagem. Padroes ancorados em formato
  # de CPF/CNPJ (com ou sem pontuacao) em vez de \d{11} solto, que apanharia
  # timestamp em milissegundos e id numerico.
  transform/redacao_pii:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # CNPJ primeiro: 14 digitos. Se o de CPF rodasse antes, comeria os 11
          # primeiros digitos de um CNPJ e deixaria o resto solto.
          - replace_pattern(body, "\\b\\d{2}\\.?\\d{3}\\.?\\d{3}/?\\d{4}-?\\d{2}\\b", "[CNPJ_REDIGIDO]")
          - replace_pattern(body, "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "[CPF_REDIGIDO]")
          - replace_pattern(attributes["message"], "\\b\\d{2}\\.?\\d{3}\\.?\\d{3}/?\\d{4}-?\\d{2}\\b", "[CNPJ_REDIGIDO]") where attributes["message"] != nil
          - replace_pattern(attributes["message"], "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "[CPF_REDIGIDO]") where attributes["message"] != nil
          - replace_pattern(attributes["cpf"], "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "[CPF_REDIGIDO]") where attributes["cpf"] != nil

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    # send_timestamps fica false (o default). Com timestamp explicito na
    # exposicao, o Prometheus desliga o tratamento de staleness dessas series:
    # quando um app cai e a serie expira aqui, o Prometheus continuaria
    # devolvendo o ultimo valor por até 5 min (lookback delta) em vez de
    # marcá-la ausente — e os alertas de "sem metricas" nunca disparariam.
    #
    # Quanto tempo uma serie sobrevive sem receber ponto novo. Com os apps
    # exportando a cada 15s, 90s dá folga para uma exportacao falhar e ainda
    # assim as series sumirem rapido quando o app cai de verdade.
    metric_expiration: 90s
    # Acrescenta _total aos contadores e o sufixo de unidade aos histogramas.
    # As metricas de negocio do prontuai já nascem nomeadas contando com isso.
    add_metric_suffixes: true
    # Os atributos de resource já viram job/instance; converter o resto
    # (telemetry.sdk.*, deployment.environment.name) só inflaria os rotulos.
    # Eles continuam consultaveis pela metrica sintetica target_info.
    resource_to_telemetry_conversion:
      enabled: false

  loki:
    endpoint: http://loki:3100/loki/api/v1/push

service:
  extensions: [bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/logs, transform/redacao_pii, batch]
      exporters: [loki]
  telemetry:
    metrics:
      # Metricas do proprio coletor (pontos recebidos, recusados, falhas de
      # exportacao), coletadas pelo job "otel-collector" do prometheus.yml.
      address: 0.0.0.0:8888
