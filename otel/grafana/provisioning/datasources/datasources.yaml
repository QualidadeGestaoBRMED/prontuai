apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Torna clicavel o pulo "linha de log -> trace completo". O campo traceid
      # vem do proprio registro OTLP (o backend exporta os logs por OTLP com o
      # span ativo), nao de parsing do texto.
      derivedFields:
        - name: trace_id
          matcherRegex: '"traceid":"(\w+)"'
          datasourceUid: tempo
          url: '${__value.raw}'
          urlDisplayLabel: "Ver trace"
