apiVersion: 1

# Regras de alerta provisionadas.
#
# Toda regra aponta para o contact point `prontuai-email` (contact-points.yml)
# por `notification_settings`, o roteamento por regra do Grafana 11. Regra nova
# precisa do mesmo bloco: sem ele o alerta cai na policy padrão da org, que é
# compartilhada com os outros projetos e não manda para ninguém do ProntuAI.

groups:
  - orgId: 1
    name: prontuai-alerts
    folder: ProntuAI
    interval: 1m
    rules:
      # Pico de erro no log do backend.
      #
      # Conta LINHAS numa janela de 5 min, e nao `rate()`: o alerta antigo
      # mostrava "0.016667", que e 5 erros em 5 min escritos em erros por
      # segundo -- ilegivel para quem recebe o e-mail.
      #
      # O limiar sai de medicao, nao de chute. Em 7 dias (2016 janelas de
      # 5 min), fora o ruido filtrado abaixo: 96% das janelas com ZERO erro,
      # mediana 1 e MAXIMO 3. Entao 5 e o dobro do pior caso normal, e nao
      # teria disparado nenhuma vez na semana medida.
      #
      # `!= "Signature has expired"`: sessao de usuario vencendo e fluxo
      # normal -- o front pega o 401 e renova pelo refresh token --, mas o
      # backend registra como ERROR (app/core/auth.py, no `except JWTError`).
      # Eram 668 das 737 linhas de erro em 3 dias, 91% do total: com elas o
      # alerta ficava aceso 18% do tempo e nao sobrava sinal nenhum. O filtro
      # aqui e remendo; o certo e a expiracao nao nascer como ERROR, e ai
      # esta linha vira redundante (inofensiva) e pode sair.
      - uid: prontuai-errors
        title: Pico de erros no backend
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: loki
                uid: loki
              expr: "sum(count_over_time({job=\"prontuai-backend\", level=\"ERROR\"} != `Signature has expired` [5m]))"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Mais de 5 erros em 5 minutos no log do backend"
          description: "Acima do normal medido (maximo 3 por janela de 5 min em 7 dias). Sessao expirada nao entra na conta. Veja os logs no Loki filtrando level=ERROR; os suspeitos recorrentes sao falha ao consultar exames obrigatorios (BRNET) e erro de OCR."
        labels:
          severity: warning
        notification_settings:
          receiver: prontuai-email

      - uid: prontuai-backend-down
        title: Backend sem métricas (fora do ar?)
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "max(prontuai_backend_up{job=\"prontuai-backend\"})"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "Nenhum processo do backend está exportando métricas"
          description: "prontuai_backend_up é um heartbeat que todo worker do backend empurra por OTLP. A série some do Prometheus ~90s (metric_expiration do collector) depois que o último worker para de exportar. Causas: backend fora do ar, OTEL_SDK_DISABLED=true, OTEL_EXPORTER_OTLP_ENDPOINT errado ou ausente, ou o otel-collector inacessível — confira o alerta do collector antes de culpar o backend."
        labels:
          severity: critical
        notification_settings:
          receiver: prontuai-email

      # Com o modelo de push o collector virou o único caminho das métricas do
      # backend: se ele cai, o alerta acima dispara junto e este aqui é o que
      # diz qual dos dois é a causa real.
      - uid: prontuai-otel-collector-down
        title: OTel Collector sem scrape (métricas do backend cegas)
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "up{job=\"otel-collector\"}"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "otel-collector fora do ar"
          description: "Sem o collector, nenhuma métrica do backend chega ao Prometheus. Verifique 'docker compose ps otel-collector' e os logs na stack de observabilidade."
        labels:
          severity: critical
        notification_settings:
          receiver: prontuai-email


      - uid: prontuai-job-backup-atrasado
        title: Backup do Postgres sem sucesso ha mais de 26h
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "time() - max(job_last_success_timestamp_seconds{task=\"db-backup\"})"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 93600
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 10m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "O backup diario do Postgres nao conclui com sucesso ha mais de 26 horas"
          description: "O alerta e sobre a IDADE do ultimo sucesso, nao sobre erro: pega tambem timer que nao disparou, script travado ou maquina desligada — casos em que nenhum exit code e gerado. Veja: journalctl -u prontuai-db-backup.service -n 50. Sem dado significa que o job nunca reportou sucesso."
        labels:
          severity: critical
        notification_settings:
          receiver: prontuai-email
          # Lembrete no ritmo do job (timer diario): repetir antes disso
          # so reimprime o mesmo fato, porque nao houve nova chance de dar
          # certo. Enquanto isso o alerta segue aceso na tela -- o silencio
          # e da notificacao, nao do estado. Sem este campo a repeticao cai
          # no padrao da org (de hora em hora), que rendeu 5 e-mails por hora.
          # As regras de infra nao levam o campo de proposito: backend fora
          # do ar deve insistir rapido.
          repeat_interval: 24h

      - uid: prontuai-job-purga-atrasada
        title: Purga semanal sem sucesso ha mais de 9 dias
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "time() - max(job_last_success_timestamp_seconds{task=\"db-purge\"})"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 777600
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 30m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "A purga semanal de registros transitorios nao conclui ha mais de 9 dias"
          description: "Janela de 9 dias da folga para uma execucao pulada pelo lock com o backup. Veja: journalctl -u prontuai-db-purge.service -n 50."
        labels:
          severity: warning
        notification_settings:
          receiver: prontuai-email
          # Lembrete no ritmo do job (timer semanal (domingo)): repetir antes disso
          # so reimprime o mesmo fato, porque nao houve nova chance de dar
          # certo. Enquanto isso o alerta segue aceso na tela -- o silencio
          # e da notificacao, nao do estado. Sem este campo a repeticao cai
          # no padrao da org (de hora em hora), que rendeu 5 e-mails por hora.
          # As regras de infra nao levam o campo de proposito: backend fora
          # do ar deve insistir rapido.
          repeat_interval: 7d

      - uid: prontuai-job-arquivamento-atrasado
        title: Arquivamento de documentos sem sucesso ha mais de 10 dias
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "time() - max(job_last_success_timestamp_seconds{task=\"arquivamento-drive\"})"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 864000
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 30m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "O arquivamento semanal de documentos nao conclui ha mais de 10 dias"
          description: "Sem ele o disco da EC2 volta a encher: sao ~8 GB de documentos por mes. Veja: journalctl -u prontuai-archive-drive.service -n 50."
        labels:
          severity: warning
        notification_settings:
          receiver: prontuai-email
          # Lembrete no ritmo do job (timer semanal (segunda)): repetir antes disso
          # so reimprime o mesmo fato, porque nao houve nova chance de dar
          # certo. Enquanto isso o alerta segue aceso na tela -- o silencio
          # e da notificacao, nao do estado. Sem este campo a repeticao cai
          # no padrao da org (de hora em hora), que rendeu 5 e-mails por hora.
          # As regras de infra nao levam o campo de proposito: backend fora
          # do ar deve insistir rapido.
          repeat_interval: 7d

      - uid: prontuai-job-offload-backups-atrasado
        title: Offload dos backups para o Drive sem sucesso ha mais de 3 dias
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "time() - max(job_last_success_timestamp_seconds{task=\"offload-backups-drive\"})"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 259200
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 30m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "O controle de tamanho do bucket de backup nao conclui ha mais de 3 dias"
          description: "O job e diario e sai com sucesso tambem quando o bucket esta abaixo do teto; 3 dias toleram execucoes puladas pelo lock. Sem ele o bucket passa do teto de 4 GB. Veja: journalctl -u prontuai-offload-backups.service -n 50."
        labels:
          severity: warning
        notification_settings:
          receiver: prontuai-email
          # Lembrete no ritmo do job (timer diario): repetir antes disso
          # so reimprime o mesmo fato, porque nao houve nova chance de dar
          # certo. Enquanto isso o alerta segue aceso na tela -- o silencio
          # e da notificacao, nao do estado. Sem este campo a repeticao cai
          # no padrao da org (de hora em hora), que rendeu 5 e-mails por hora.
          # As regras de infra nao levam o campo de proposito: backend fora
          # do ar deve insistir rapido.
          repeat_interval: 24h

      - uid: prontuai-job-com-falha
        title: Job de manutencao terminou com erro
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "max by (task) (job_last_exit_code)"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 5m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "Um job de manutencao do banco terminou com codigo diferente de zero"
          description: "Complementa os alertas de atraso: aqui o job rodou e falhou, entao o erro esta no journal da unit correspondente."
        labels:
          severity: warning
        notification_settings:
          receiver: prontuai-email
          # Lembrete no ritmo do job (cobre jobs diarios): repetir antes disso
          # so reimprime o mesmo fato, porque nao houve nova chance de dar
          # certo. Enquanto isso o alerta segue aceso na tela -- o silencio
          # e da notificacao, nao do estado. Sem este campo a repeticao cai
          # no padrao da org (de hora em hora), que rendeu 5 e-mails por hora.
          # As regras de infra nao levam o campo de proposito: backend fora
          # do ar deve insistir rapido.
          repeat_interval: 24h

      - uid: prontuai-db-down
        title: Postgres sem scrape (exporter ou banco fora do ar?)
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "up{job=\"postgres\"}"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "Prometheus não consegue coletar métricas do Postgres"
          description: "prontuai-db-exporter ou o container prontuai-db podem estar fora do ar. Verifique docker-compose.db.yml na VPS."
        labels:
          severity: critical
        notification_settings:
          receiver: prontuai-email

      - uid: prontuai-5xx-rate
        title: Taxa de erros 5xx acima de 5%
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "100 * sum(rate(http_server_request_duration_seconds_count{job=\"prontuai-backend\", http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{job=\"prontuai-backend\"}[5m]))"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Mais de 5% das requisições retornando 5xx"
          description: "Verifique logs no Loki e erros no Sentry."
        labels:
          severity: critical
        notification_settings:
          receiver: prontuai-email

      - uid: prontuai-ocr-lento
        title: OCR degradado (p95 > 5 min)
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "histogram_quantile(0.95, sum by (le) (rate(prontuai_ocr_duracao_segundos_bucket[30m])))"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 300
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "p95 do OCR acima de 5 minutos"
          description: "Possível fila no Textract ou uso do fallback Docling."
        labels:
          severity: warning
        notification_settings:
          receiver: prontuai-email

      - uid: prontuai-fallback-docling
        title: Fallback Docling ativado
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "sum(increase(prontuai_ocr_fallback_docling_total[1h]))"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Textract indisponível; documentos processados com OCR local (Docling)"
          description: "Qualidade do OCR pode degradar. Verifique timeouts do Textract."
        labels:
          severity: warning
        notification_settings:
          receiver: prontuai-email

      - uid: prontuai-qualidade
        title: Qualidade de entrega degradada (score de confiança baixo)
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "histogram_quantile(0.50, sum by (le) (rate(prontuai_confianca_score_bucket[1h])))"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 60
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 30m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Mediana do score de confiança dos documentos abaixo de 60"
          description: "Documentos sendo entregues com baixa qualidade (OCR ruim ou exames obrigatórios não encontrados). Verifique fallback Docling, clínicas com scans fora do padrão e a API externa."
        labels:
          severity: warning
        notification_settings:
          receiver: prontuai-email

      - uid: prontuai-disco
        title: Disco acima de 85%
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\", fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype!~\"tmpfs|overlay\"})"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 85
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Disco da EC2 acima de 85%"
          description: "Logs, resultados de OCR e volumes Docker podem estar crescendo. Limpe ou expanda o disco."
        labels:
          severity: warning
        notification_settings:
          receiver: prontuai-email

      - uid: prontuai-ram
        title: Memória acima de 90%
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)"
              refId: A
              queryType: range
          - refId: C
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 90
                  operator:
                    type: and
                  reducer:
                    type: last
                  query:
                    params:
                      - A
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Memória da EC2 acima de 90%"
          description: "Risco de OOM kill do backend/OCR. Verifique consumo por container no dashboard."
        labels:
          severity: critical
        notification_settings:
          receiver: prontuai-email
